<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Degibbs — NeuroDesk</title>
  </head>
  <body>
    <header id="controls">
      <details class="nd-sidebar-section" id="inputSection" open>
        <summary class="nd-section-title">Input image</summary>
        <div class="nd-section-content">
          <div id="exampleControl"></div>
          <label class="nd-file" id="dropZone">
            <input id="imageInput" type="file" data-neurodesk-input="image" multiple aria-label="Choose a NIfTI image with optional bval, bvec and sidecar, DICOM files, or a BIDS folder" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop NIfTI or DICOM files or folder</span>
          </label>
          <div class="nd-field" id="runField" hidden>
            <label for="runSelect">DWI run</label>
            <select id="runSelect"></select>
          </div>
          <p id="fileInfo" class="nd-file-info" hidden></p>
        </div>
      </details>

      <details class="nd-sidebar-section" id="taskSection" open>
        <summary class="nd-section-title">Gibbs-ringing removal</summary>
        <div class="nd-section-content">
          <div class="nd-field">
            <label for="sliceAxes">Slice plane
              <span class="nd-info-icon" tabindex="0" aria-label="About the slice plane">i<span class="nd-info-tooltip">Ringing is removed within each acquired 2D slice. The sidecar's SliceEncodingDirection sets the plane when it has one.</span></span>
            </label>
            <select id="sliceAxes">
              <option value="0,1" selected>Axes 1 and 2 (axial slices)</option>
              <option value="0,2">Axes 1 and 3 (coronal slices)</option>
              <option value="1,2">Axes 2 and 3 (sagittal slices)</option>
            </select>
          </div>
          <p class="nd-hint">Use after denoising, before interpolation; avoid partial-Fourier filled data.</p>
          <button id="runButton" class="nd-btn nd-btn-primary" type="button" disabled>Remove ringing</button>
        </div>
      </details>

      <details class="nd-sidebar-section" id="outputSection">
        <summary class="nd-section-title">Output</summary>
        <div class="nd-section-content">
          <div id="resultList"></div>
        </div>
      </details>

      <button id="aboutBtn" type="button" hidden>About</button>
      <button id="privacyBtn" type="button" hidden>Privacy</button>
    </header>

    <main id="viewer">
      <div class="nd-viewer-canvas-wrapper">
        <canvas id="gl1" aria-label="Image viewer"></canvas>
        <p id="emptyState" class="nd-viewer-empty">Drop an image anywhere, or choose an example.</p>
      </div>
      <div class="nd-viewer-info"><span id="location" class="nd-viewer-info-primary"></span></div>
    </main>

    <footer id="status">
      <span class="nd-status-label">Status</span>
      <span id="statusText" class="nd-status-text" role="status" aria-live="polite">Drag and drop files</span>
      <span id="elapsed" class="nd-status-elapsed"></span>
      <progress id="progress" max="1" value="0" aria-label="Correction progress"></progress>
      <button id="cancelButton" class="nd-btn-cancel" type="button" title="Cancel correction" aria-label="Cancel correction" hidden>×</button>
    </footer>

    <template id="aboutContent">
      <p>Degibbs removes Gibbs ringing, the ripples beside sharp edges in MRI, in this browser. It shifts each 2D slice by subvoxel amounts and, at every sample, keeps the shift with the least local variation (Kellner et al. 2016). It is a port of MRtrix3 3.0.8 mrdegibbs and gives its results to within 1e-13. Use it after denoising and before registration interpolates the data; partial-Fourier acquisitions have a different ringing, which this method removes only in part. A bval and bvec chosen with the image are passed through under the output's name. A dropped BIDS folder gives each DWI run with its bval, bvec and inherited JSON sidecar; choose the run when there is more than one.</p>
    </template>
    <template id="privacyContent"><p>Images are processed locally in this browser and are never uploaded.</p></template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
