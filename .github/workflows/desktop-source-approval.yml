name: desktop-source-approval

on:
  pull_request:
    paths:
      - 'packages/desktop/src/**'
      - 'packages/desktop/test/source-approval.test.js'
      - '.github/workflows/desktop-source-approval.yml'
  push:
    branches: [main]
    paths:
      - 'packages/desktop/src/**'
      - 'packages/desktop/test/source-approval.test.js'
      - '.github/workflows/desktop-source-approval.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-paths:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Test source approvals and native Windows file loading
        run: node --test packages/desktop/test/source-approval.test.js
