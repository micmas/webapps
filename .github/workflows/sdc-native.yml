name: sdc-native

on:
  pull_request:
    paths:
      - '.github/workflows/sdc-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/sdc/**'
      - 'exes/nifti/**'
      - 'packages/sdc/**'
      - 'packages/runtime-support/package.json'
      - 'packages/runtime-support/src/mindgrab/backend.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdc-native.yml'
      - '.github/actions/setup-wasm-opt/**'
      - 'exes/sdc/**'
      - 'exes/nifti/**'
      - 'packages/sdc/**'
      - 'packages/runtime-support/package.json'
      - 'packages/runtime-support/src/mindgrab/backend.js'
  workflow_dispatch:

concurrency:
  group: sdc-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: exes/sdc tests, clippy and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Test
        working-directory: exes/sdc
        run: cargo +1.98.0 test --workspace --locked --release
      - name: Clippy
        working-directory: exes/sdc
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Format
        working-directory: exes/sdc
        run: cargo +1.98.0 fmt --all --check

  wasm-source:
    name: committed WASM module equals a rebuild from source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
      - name: Set up wasm-opt
        uses: ./.github/actions/setup-wasm-opt
      - name: Rebuild and compare sdc
        run: bash packages/sdc/scripts/build-wasm.sh --check
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      # src/webgpu.js imports @neurodesk/runtime-support, a workspace dependency.
      - name: Install frozen dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: pnpm install --frozen-lockfile
      - name: sdc package tests on the committed module
        working-directory: packages/sdc
        run: node --test test/*.test.js
